services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: real_estate_app
    # Wait-for-it removed since there's no database dependency
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "info" ]
    ports:
      - "80:8000"

    volumes:
      - ./data/images:/app/data/images
      - ./data/text:/app/data/text

    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      # Add any additional environment variables needed for production
